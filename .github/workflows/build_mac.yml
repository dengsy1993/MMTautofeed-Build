name: Mac云端打包流水线

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

# 加入这行环境变量，直接静音你看到的那个 Node.js 20 警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 requests torf qbittorrentapi

      - name: 执行 PyInstaller 打包
        run: |
          # 【修复点】将应用名称改为纯英文 MMTAUTO，避免 Mac 底层路径乱码报错
          pyinstaller --noconfirm --onefile --windowed --name "MMTAUTO" mmtauto_gui.py

      - name: 检查打包结果 (防丢失)
        run: |
          # 这一步是为了如果再失败，咱们能看到底层到底生成了什么文件
          ls -la dist/ || echo "dist 文件夹没有生成！"

      - name: 压缩成 ZIP
        run: |
          cd dist
          zip -r MMTAUTO_Mac.zip MMTAUTO.app

      - name: 上传最终成品
        uses: actions/upload-artifact@v4
        with:
          name: Mac版发种工具
          path: dist/MMTAUTO_Mac.zip
