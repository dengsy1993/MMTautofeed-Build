name: Mac云端打包流水线

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 requests torf qbittorrentapi

      - name: 执行 PyInstaller 打包
        run: |
          # 就在这里！已经改成了你实际上传的 mmtauto_gui-Mac-V1.0.py
          pyinstaller --noconfirm --onefile --windowed --name "MMTAUTO" mmtauto_gui-Mac-V1.0.py

      - name: 检查打包结果 (防丢失)
        run: |
          ls -la dist/ || echo "dist 文件夹没有生成！"

      - name: 压缩成 ZIP
        run: |
          cd dist
          zip -r MMTAUTO_Mac.zip MMTAUTO.app

      - name: 上传最终成品
        uses: actions/upload-artifact@v4
        with:
          name: Mac版发种工具
          path: dist/MMTAUTO_Mac.zip
