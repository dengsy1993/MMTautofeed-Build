name: Mac 云端打包流水线

on:
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 requests torf qbittorrent-api

      - name: 执行 PyInstaller 打包
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon="app_icon.icns" --hidden-import=torf --hidden-import=qbittorrentapi --name "MMTautofeed" MMTautofeed.py

      - name: 深度修复双图标 (注入 LSUIElement)
        if: ${{ true }}
        run: |
          PLIST="dist/MMTautofeed.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :LSUIElement true" "$PLIST"
          echo "✅ Info.plist 已成功注入 LSUIElement 参数"

      - name: 压缩成 ZIP
        run: |
          cd dist
          zip -r MMTautofeed_Mac.zip MMTautofeed.app

      - name: 上传最终成品
        uses: actions/upload-artifact@v4
        with:
          name: MMTautofeed_MacOS_Package
          path: dist/MMTautofeed_Mac.zip
