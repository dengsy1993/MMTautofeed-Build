name: Windows 云端打包流水线

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 requests torf qbittorrent-api

      # 单文件 exe（--onefile）：产物只有一个 MMTautofeed.exe，便于分发。
      # 注意：单文件启动时会先自解压，所以打开比 onedir 慢几秒，这是打包机制的固有代价。
      # --icon 设置 exe 文件图标；--add-data 把 ico 打进包，运行期窗口/任务栏图标才完整。
      - name: 执行 PyInstaller 打包（单文件 exe）
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --icon "app_icon.ico"
          --add-data "app_icon.ico;."
          --hidden-import=torf --hidden-import=qbittorrentapi
          --exclude-module tkinter --exclude-module unittest --exclude-module pydoc
          --exclude-module PyQt6.QtQml --exclude-module PyQt6.QtQuick
          --exclude-module PyQt6.QtWebEngineCore --exclude-module PyQt6.QtMultimedia
          --exclude-module PyQt6.QtSql --exclude-module PyQt6.QtTest
          --name "MMTautofeed" MMTautofeed.py

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: MMTautofeed_Windows_Package
          path: dist/MMTautofeed.exe
