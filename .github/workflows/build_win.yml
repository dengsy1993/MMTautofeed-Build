name: Windows 云端打包流水线

on:
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 requests torf qbittorrent-api

      - name: 执行 PyInstaller 打包
        run: |
          # Windows 下打出的直接是单个 .exe 文件
          pyinstaller --noconfirm --onefile --windowed --icon="app_icon.ico" --name "MMTautofeed" MMTautofeed.py

      - name: 上传最终成品
        uses: actions/upload-artifact@v4
        with:
          name: MMTautofeed_Windows_Package
          # GitHub 会自动将该 exe 压缩为 zip 供你下载
          path: dist/MMTautofeed.exe
