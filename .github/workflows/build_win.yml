name: Windows 云端打包流水线

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 requests torf qbittorrent-api

      # 用 --onedir：启动时无需解压，比 --onefile 快很多，程序打开更跟手。
      # --icon 设置 exe 文件图标；--add-data 把 ico 打进包，运行期窗口/任务栏图标才完整。
      - name: 执行 PyInstaller 打包（onedir，启动更快）
        run: >
          pyinstaller --noconfirm --onedir --windowed
          --icon "app_icon.ico"
          --add-data "app_icon.ico;."
          --hidden-import=torf --hidden-import=qbittorrentapi
          --name "MMTautofeed" MMTautofeed.py

      - name: 压缩为 ZIP
        run: Compress-Archive -Path dist/MMTautofeed -DestinationPath dist/MMTautofeed_Windows.zip

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: MMTautofeed_Windows_Package
          path: dist/MMTautofeed_Windows.zip
